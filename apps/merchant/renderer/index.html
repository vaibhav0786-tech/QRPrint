<!doctype html><html><head><meta charset="utf-8"><title>QRPrint Merchant</title><style>body{font-family:system-ui;background:#f5f5f0;margin:0;color:#20211f}aside{position:fixed;width:220px;inset:0 auto 0 0;background:#20211f;color:#fff;padding:26px}main{margin-left:220px;padding:45px}h1{font-size:32px}button{border:0;border-radius:7px;padding:10px 14px;background:#d8ff55;font-weight:700;cursor:pointer}.card{background:#fff;border:1px solid #e5e3dc;border-radius:12px;padding:22px;margin-top:20px;max-width:880px}.muted{color:#777;font-size:13px}table{width:100%;border-collapse:collapse;margin-top:12px}td,th{text-align:left;padding:12px;border-bottom:1px solid #eee;font-size:13px}.status{background:#edf7d9;color:#597121;padding:4px 7px;border-radius:10px;font-size:11px}input{padding:10px;border:1px solid #ddd;border-radius:7px;width:180px;text-transform:uppercase}</style></head><body><aside><h2>▣ QRPrint</h2><p>Dashboard</p><p>Print queue</p><p>Stores</p><hr><p class="muted">Settings</p></aside><main><p class="muted">PRINTSPOT · LOCAL CONSOLE</p><h1>Today&apos;s print queue</h1><div class="card"><button onclick="addStore()">+ Add store location</button><div id="stores" class="muted"></div></div><div class="card"><b>Collection counter</b><p class="muted">Enter a ready order’s code to securely mark it collected.</p><input id="collectionCode" maxlength="8" placeholder="e.g. R7K4M9"><button onclick="collect()">Hand over order</button><p id="collectionResult" class="muted"></p></div><div class="card"><b>Orders</b><table><thead><tr><th>File</th><th>Store</th><th>Status</th><th>Collection</th><th>Print</th></tr></thead><tbody id="jobs"><tr><td colspan="5">No paid jobs yet.</td></tr></tbody></table></div></main><script>async function load(){let s=await qrprint.stores.list();stores.innerHTML=s.map(x=>'<p><b>'+x.name+'</b> &nbsp; '+x.slug+'</p>').join('')||'<p>Create a store to generate its unique QR code.</p>';let j=await qrprint.jobs.list();jobs.innerHTML=j.length?j.map(x=>'<tr><td>'+x.filename+'</td><td>'+x.store_name+'</td><td><span class=status>'+x.status+'</span></td><td>'+ (x.collection_code||'—')+'</td><td>'+(x.status==='paid'?'<button onclick="complete('+x.id+')">Complete print</button>':'—')+'</td></tr>').join(''):'<tr><td colspan=5>No paid jobs yet.</td></tr>'}async function addStore(){let n=prompt('Store name');if(n){let s=await qrprint.stores.create(n);alert('Store created. QR code URL: '+s.slug);load()}}async function complete(id){let c=await qrprint.jobs.complete(id);alert('Print complete. Append collection code '+c+' to the printed job.');load()}async function collect(){let r=await qrprint.jobs.collect(collectionCode.value);collectionResult.textContent=r.message;if(r.ok){collectionCode.value='';load()}}load()</script></body></html>
